<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --cream: #f6f3e9;
        --brown: #2e1c0f;
        --yellow: #f4c51a;
        --muted: #e4dfcd;
        --muted-fg: #6b472e;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        background: var(--cream);
        color: var(--brown);
        font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        font-size: 12px;
        padding: 14px;
      }
      h1 {
        font-family: "Bricolage Grotesque", sans-serif;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: -0.02em;
        font-size: 20px;
        margin: 0 0 2px;
      }
      .subtitle {
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-size: 9px;
        font-weight: 700;
        color: var(--muted-fg);
        margin-bottom: 14px;
      }
      .group { margin-bottom: 16px; }
      .group-label {
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 9px;
        font-weight: 800;
        color: var(--muted-fg);
        margin-bottom: 6px;
      }
      button.action {
        display: block;
        width: 100%;
        text-align: left;
        background: var(--cream);
        color: var(--brown);
        border: 2px solid var(--brown);
        border-radius: 4px;
        padding: 9px 11px;
        font-weight: 700;
        font-size: 12px;
        cursor: pointer;
        box-shadow: 3px 3px 0 0 var(--brown);
        transition: transform 0.06s, box-shadow 0.06s;
        margin-bottom: 9px;
        font-family: inherit;
      }
      button.action:hover { background: #fffdf6; }
      button.action:active {
        transform: translate(3px, 3px);
        box-shadow: 0 0 0 0 var(--brown);
      }
      button.action.primary { background: var(--yellow); }
      button.action small {
        display: block;
        font-weight: 500;
        font-size: 10px;
        color: var(--muted-fg);
        margin-top: 2px;
      }
      label.field { display: block; margin-bottom: 8px; }
      label.field span {
        display: block;
        font-size: 10px;
        font-weight: 700;
        margin-bottom: 3px;
      }
      input, select {
        width: 100%;
        border: 2px solid var(--brown);
        border-radius: 4px;
        padding: 7px 8px;
        font-size: 12px;
        background: #fff;
        color: var(--brown);
        font-family: inherit;
      }
      .row { display: flex; gap: 8px; }
      .row > * { flex: 1; }
      #custom-size { display: none; }
      #custom-size.show { display: flex; }
      hr { border: none; border-top: 2px dashed var(--muted); margin: 14px 0; }
      #status {
        margin-top: 12px;
        font-size: 11px;
        min-height: 16px;
        font-weight: 600;
        white-space: pre-wrap;
      }
      #status.info { color: var(--muted-fg); }
      #status.success { color: #1f7a33; }
      #status.error { color: #b3261e; }
    </style>
  </head>
  <body>
    <h1>Pico.</h1>
    <div class="subtitle">Figma Plugin</div>

    <div class="group">
      <div class="group-label">Design tokens &amp; library</div>
      <button class="action primary" id="btn-sync-tokens">
        Sync tokens
        <small>Create / update Figma variables, text &amp; effect styles</small>
      </button>
      <button class="action" id="btn-generate-components">
        Generate components
        <small>Build the Pico component library as Figma components</small>
      </button>
    </div>

    <hr />

    <div class="group">
      <div class="group-label">Page from URL</div>
      <label class="field">
        <span>URL</span>
        <input id="url" type="url" placeholder="https://example.com/page" />
      </label>
      <label class="field">
        <span>Render service (optional)</span>
        <input id="render-base" type="url" placeholder="https://your-app.replit.app" />
      </label>
      <label class="field">
        <span>Device size</span>
        <select id="device">
          <option value="desktop">Desktop — 1440 × 1024</option>
          <option value="tablet">Tablet — 834 × 1112</option>
          <option value="mobile">Mobile — 390 × 844</option>
          <option value="custom">Custom…</option>
        </select>
      </label>
      <div class="row" id="custom-size">
        <label class="field">
          <span>Width</span>
          <input id="custom-w" type="number" value="1280" min="64" />
        </label>
        <label class="field">
          <span>Height</span>
          <input id="custom-h" type="number" value="900" min="64" />
        </label>
      </div>
      <button class="action" id="btn-page">
        Reconstruct page
        <small>Read the page &amp; rebuild it with components + tokens</small>
      </button>
    </div>

    <hr />

    <div class="group">
      <div class="group-label">Placeholder</div>
      <button class="action" id="btn-placeholder">
        Generate sample page
        <small>A ready-made layout from real instances + tokens</small>
      </button>
    </div>

    <div id="status" class="info"></div>

    <script>
      /* __PICO_PLUGIN_UI_BUNDLE__ */
    </script>
  </body>
</html>
