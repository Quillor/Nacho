openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: storage
    description: Object storage operations
  - name: recordings
    description: Published recording operations
  - name: app
    description: App metadata operations
  - name: admin
    description: Admin console operations (super-admin only)
  - name: content
    description: Public content (terms of service)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlInput"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
  /recordings:
    post:
      operationId: publishRecording
      tags: [recordings]
      summary: Publish a recording (store metadata; media already uploaded)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedRecording"
  /recordings/{shareId}:
    get:
      operationId: getRecording
      tags: [recordings]
      summary: Get a published recording by share id
      parameters:
        - name: shareId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The published recording
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedRecording"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateRecording
      tags: [recordings]
      summary: Update an already-published recording's editable metadata
      parameters:
        - name: shareId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordingUpdateInput"
      responses:
        "200":
          description: The updated recording
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedRecording"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /recordings/{shareId}/visibility:
    patch:
      operationId: setRecordingVisibility
      tags: [recordings]
      summary: Change a recording's visibility (publish / unpublish)
      parameters:
        - name: shareId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisibilityInput"
      responses:
        "200":
          description: The updated recording
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedRecording"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /recordings/{shareId}/views:
    post:
      operationId: addRecordingView
      tags: [recordings]
      summary: Increment the view count for a recording
      parameters:
        - name: shareId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated view count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewCount"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /version:
    get:
      operationId: getVersion
      tags: [app]
      summary: Get the current app version
      responses:
        "200":
          description: Version info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      summary: Dashboard summary counts and recent activity
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all users with their roles and groups
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users/{userId}:
    get:
      operationId: getAdminUser
      tags: [admin]
      summary: Get a single user's detail
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users/{userId}/role:
    patch:
      operationId: setUserRole
      tags: [admin]
      summary: Promote or demote a user (super_admin / user)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users/{userId}/groups:
    put:
      operationId: setUserGroups
      tags: [admin]
      summary: Replace the set of groups a user belongs to
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserGroupAssignment"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
  /admin/users/{userId}/impersonate:
    post:
      operationId: impersonateUser
      tags: [admin]
      summary: Create a Clerk actor token to log in as a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Impersonation ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpersonationTicket"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/groups:
    get:
      operationId: listGroups
      tags: [admin]
      summary: List all user groups
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserGroup"
    post:
      operationId: createGroup
      tags: [admin]
      summary: Create a user group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "201":
          description: Created group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserGroup"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/groups/{groupId}:
    patch:
      operationId: updateGroup
      tags: [admin]
      summary: Rename or update a user group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupUpdate"
      responses:
        "200":
          description: Updated group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserGroup"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteGroup
      tags: [admin]
      summary: Delete a user group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/notifications:
    post:
      operationId: sendNotification
      tags: [admin]
      summary: Send an email notification to all users or a group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationInput"
      responses:
        "200":
          description: Send result summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/content/tos:
    get:
      operationId: getTosAdmin
      tags: [admin]
      summary: Get the current terms of service (admin)
      responses:
        "200":
          description: Terms of service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TosDocument"
    put:
      operationId: updateTos
      tags: [admin]
      summary: Update the terms of service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TosInput"
      responses:
        "200":
          description: Updated terms of service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TosDocument"
  /tos:
    get:
      operationId: getPublicTos
      tags: [content]
      summary: Get the current public terms of service
      responses:
        "200":
          description: Terms of service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TosDocument"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    UploadUrlInput:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
        size:
          type: integer
        contentType:
          type: string
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
    Chapter:
      type: object
      required: [time, label]
      properties:
        time:
          type: number
        label:
          type: string
    TranscriptSegment:
      type: object
      required: [start, end, text]
      properties:
        start:
          type: number
        end:
          type: number
        text:
          type: string
    Visibility:
      type: string
      enum: [private, public]
    VisibilityInput:
      type: object
      required: [visibility]
      properties:
        visibility:
          $ref: "#/components/schemas/Visibility"
    RecordingInput:
      type: object
      required:
        - title
        - durationSec
        - trimStart
        - trimEnd
        - videoPath
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        visibility:
          $ref: "#/components/schemas/Visibility"
        durationSec:
          type: number
        trimStart:
          type: number
        trimEnd:
          type: number
        hasAudio:
          type: boolean
        videoPath:
          type: string
        thumbnailPath:
          type: ["string", "null"]
        gifPath:
          type: ["string", "null"]
        chapters:
          type: array
          items:
            $ref: "#/components/schemas/Chapter"
        transcript:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptSegment"
    RecordingUpdateInput:
      type: object
      required:
        - title
        - durationSec
        - trimStart
        - trimEnd
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        durationSec:
          type: number
        trimStart:
          type: number
        trimEnd:
          type: number
        hasAudio:
          type: boolean
        gifPath:
          type: ["string", "null"]
        chapters:
          type: array
          items:
            $ref: "#/components/schemas/Chapter"
        transcript:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptSegment"
    PublishedRecording:
      type: object
      required:
        - shareId
        - title
        - description
        - visibility
        - durationSec
        - trimStart
        - trimEnd
        - hasAudio
        - videoPath
        - chapters
        - transcript
        - views
        - createdAt
      properties:
        shareId:
          type: string
        title:
          type: string
        description:
          type: string
        visibility:
          $ref: "#/components/schemas/Visibility"
        durationSec:
          type: number
        trimStart:
          type: number
        trimEnd:
          type: number
        hasAudio:
          type: boolean
        videoPath:
          type: string
        thumbnailPath:
          type: ["string", "null"]
        gifPath:
          type: ["string", "null"]
        chapters:
          type: array
          items:
            $ref: "#/components/schemas/Chapter"
        transcript:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptSegment"
        views:
          type: integer
        createdAt:
          type: string
    ViewCount:
      type: object
      required: [views]
      properties:
        views:
          type: integer
    VersionInfo:
      type: object
      required: [version]
      properties:
        version:
          type: string
        releaseDate:
          type: ["string", "null"]
    AdminRole:
      type: string
      enum: [super_admin, user]
    UserGroup:
      type: object
      required: [id, name, memberCount, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        memberCount:
          type: integer
        createdAt:
          type: string
    AdminUser:
      type: object
      required: [id, email, role, groups, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        role:
          $ref: "#/components/schemas/AdminRole"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/UserGroup"
        recordingCount:
          type: integer
        createdAt:
          type: string
        lastSignInAt:
          type: ["string", "null"]
    RoleInput:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/AdminRole"
    GroupInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
    GroupUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
    UserGroupAssignment:
      type: object
      required: [groupIds]
      properties:
        groupIds:
          type: array
          items:
            type: integer
    ImpersonationTicket:
      type: object
      required: [token, ticketUrl]
      properties:
        token:
          type: string
        ticketUrl:
          type: string
    NotificationAudience:
      type: string
      enum: [all, group]
    NotificationInput:
      type: object
      required: [subject, body, audience]
      properties:
        subject:
          type: string
          minLength: 1
        body:
          type: string
          minLength: 1
        audience:
          $ref: "#/components/schemas/NotificationAudience"
        groupId:
          type: ["integer", "null"]
    NotificationResult:
      type: object
      required: [sent, failed, total]
      properties:
        sent:
          type: integer
        failed:
          type: integer
        total:
          type: integer
        message:
          type: ["string", "null"]
    TosDocument:
      type: object
      required: [content, updatedAt]
      properties:
        content:
          type: string
        updatedAt:
          type: string
    TosInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
    AdminRecordingActivity:
      type: object
      required: [shareId, title, views, visibility, createdAt]
      properties:
        shareId:
          type: string
        title:
          type: string
        views:
          type: integer
        visibility:
          $ref: "#/components/schemas/Visibility"
        createdAt:
          type: string
        ownerEmail:
          type: ["string", "null"]
    AdminSummary:
      type: object
      required: [totalUsers, totalRecordings, totalViews, recentSignups, recentRecordings]
      properties:
        totalUsers:
          type: integer
        totalRecordings:
          type: integer
        totalViews:
          type: integer
        recentSignups:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        recentRecordings:
          type: array
          items:
            $ref: "#/components/schemas/AdminRecordingActivity"
