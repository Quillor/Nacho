kind = "web"
previewPath = "/design-system/"
title = "Pico Design System"
version = "1.0.0"
id = "artifacts/pico"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/design-system/" ]
localPort = 20637

[services.development]
run = "pnpm --filter @workspace/pico run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pico", "run", "build" ]
publicDir = "artifacts/pico/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20637"
BASE_PATH = "/design-system/"
